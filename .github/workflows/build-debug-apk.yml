name: Build Debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Gradle output is mirrored into ::error:: annotations on failure so
      # compile errors are visible in the run summary / API, not only logs.
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/unit-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: |error: |FAILED|FAILURE:' /tmp/unit-test.log | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: |error: |FAILED|FAILURE:' /tmp/build.log | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      # The signed public APK is published by release.yml from version tags.
      # Build the minified release variant here too so R8 problems are caught
      # before a maintainer creates a release tag. This unsigned output is
      # only a compile/minify sanity check and is not uploaded.
      - name: Check release build
        shell: bash
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/release-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: |error: |FAILED|FAILURE:' /tmp/release-check.log | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-vault-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
