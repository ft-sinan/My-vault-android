name: Temporary Import Translations

on:
  push:
    branches:
      - arena/c4a665d2-my-vault-android
    paths:
      - .github/workflows/temporary-import-translations.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated translations from the generation run
        uses: actions/download-artifact@v4
        with:
          name: generated-locales
          path: imported-locales
          run-id: 40070739397
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import generated Android resources
        shell: bash
        run: |
          set -euo pipefail
          find imported-locales -maxdepth 3 -type f -print
          for dir in imported-locales/values-*; do
            test -d "$dir"
            cp -R "$dir" app/src/main/res/
          done
          cp imported-locales/translation-report.json \
            tools/translation/translation-report.generated.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values-hi app/src/main/res/values-es \
            app/src/main/res/values-fr app/src/main/res/values-ar \
            app/src/main/res/values-ru app/src/main/res/values-pt-rBR \
            app/src/main/res/values-zh-rCN app/src/main/res/values-in \
            app/src/main/res/values-de app/src/main/res/values-ja \
            app/src/main/res/values-ko app/src/main/res/values-tr \
            app/src/main/res/values-it \
            tools/translation/translation-report.generated.json
          if git diff --cached --quiet; then
            echo "No generated translation changes to import."
            exit 0
          fi
          git commit -m "[arena-c4a665d2] Import generated global translations"
          git push origin HEAD:arena/c4a665d2-my-vault-android
