name: Temporary Generate Translations

on:
  push:
    branches:
      - arena/c4a665d2-my-vault-android
    paths:
      - .github/workflows/temporary-generate-translations.yml
      - tools/translation/generate_google_translations.py
      - app/src/main/res/values/strings.xml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Android translations
        run: >-
          python tools/translation/generate_google_translations.py
          --output-root generated-locales

      - name: Upload generated translations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-locales
          path: generated-locales
          if-no-files-found: warn
