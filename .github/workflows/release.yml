name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MYVAULT_RELEASE_STORE_PASSWORD: ${{ secrets.MYVAULT_RELEASE_STORE_PASSWORD }}
      MYVAULT_RELEASE_KEY_ALIAS: ${{ secrets.MYVAULT_RELEASE_KEY_ALIAS }}
      MYVAULT_RELEASE_KEY_PASSWORD: ${{ secrets.MYVAULT_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate release tag and signing secrets
        shell: bash
        env:
          MYVAULT_RELEASE_KEYSTORE_BASE64: ${{ secrets.MYVAULT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.1.0 (got: $RELEASE_TAG)"
            exit 1
          fi

          app_version="$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match app versionName $app_version"
            exit 1
          fi

          missing=0
          for name in \
            MYVAULT_RELEASE_KEYSTORE_BASE64 \
            MYVAULT_RELEASE_STORE_PASSWORD \
            MYVAULT_RELEASE_KEY_ALIAS \
            MYVAULT_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Create one permanent release keystore, back it up safely, and add these repository secrets before tagging a public release."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/myvault-release.jks"
          printf '%s' "$MYVAULT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "MYVAULT_RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run release unit tests
        shell: bash
        run: |
          set +e
          ./gradlew testReleaseUnitTest --stacktrace 2>&1 | tee /tmp/release-unit-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: |error: |FAILED|FAILURE:' /tmp/release-unit-test.log | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Build signed release APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/release-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: |error: |FAILED|FAILURE:' /tmp/release-build.log | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Prepare release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_name="FTVault-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/$apk_name"
          (
            cd release-assets
            sha256sum "$apk_name" > "$apk_name.sha256"
          )

          awk -v version="$APP_VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            printf 'FT Vault %s\n' "$RELEASE_TAG" > /tmp/release-notes.md
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_name="FTVault-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "release-assets/$apk_name" \
              "release-assets/$apk_name.sha256" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "FT Vault $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              "release-assets/$apk_name" \
              "release-assets/$apk_name.sha256" \
              --verify-tag \
              --title "FT Vault $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md
          fi
