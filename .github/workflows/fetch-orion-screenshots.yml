name: Fetch Orion screenshots (temporary)

on:
  push:
    branches: ["arena/16bfecb9-my-vault-android"]
    paths:
      - ".github/workflows/fetch-orion-screenshots.yml"

permissions:
  contents: write

jobs:
  fetch:
    name: Download Orion submission screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Download screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/store/orion-fetched
          cat > urls.txt <<'URLS'
          https://cdn.phototourl.com/member/2026-10-23-7d364c1d-d1c6-49b1-bd89-8b0d26713304.jpg
          https://cdn.phototourl.com/member/2026-10-23-f74ff853-ad1c-4879-89b0-0074bc0ec471.jpg
          https://cdn.phototourl.com/member/2026-10-23-c8bfa7e8-dee9-4650-bcc9-6c4971df5701.jpg
          https://cdn.phototourl.com/member/2026-10-23-f01656a0-7ea5-4169-b849-a8eb01dce7a2.jpg
          https://cdn.phototourl.com/member/2026-10-23-8b011650-c932-49f1-a575-b901f9cfa652.jpg
          https://cdn.phototourl.com/member/2026-10-23-15d095eb-32b2-4966-9b99-78b86d2d6af9.jpg
          https://cdn.phototourl.com/member/2026-10-23-f5db646e-fd3d-4a37-81eb-0446e4b83faa.jpg
          https://cdn.phototourl.com/member/2026-10-23-4f1adaa3-b0ae-4420-8fbc-671a1d3ce16b.jpg
          https://cdn.phototourl.com/member/2026-10-23-7628e80c-9110-40d5-b925-44a2f9f810b3.jpg
          URLS
          index=1
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            printf -v name '%02d.jpg' "$index"
            curl --location --fail --retry 3 --retry-delay 2 \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
              --referer 'https://github.com/RookieEnough/Orion-Data/issues/2185' \
              --output "docs/store/orion-fetched/$name" "$url"
            index=$((index + 1))
          done < urls.txt
          file docs/store/orion-fetched/*
          sha256sum docs/store/orion-fetched/* | tee docs/store/orion-fetched/SHA256SUMS.txt
          cp urls.txt docs/store/orion-fetched/source-urls.txt

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: orion-submission-screenshots
          path: docs/store/orion-fetched/
          if-no-files-found: error

      - name: Commit fetched originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/store/orion-fetched
          if git diff --cached --quiet; then
            echo 'No screenshot changes to commit.'
          else
            git commit -m 'Fetch Orion submission screenshot originals'
            git push origin HEAD:arena/16bfecb9-my-vault-android
          fi
