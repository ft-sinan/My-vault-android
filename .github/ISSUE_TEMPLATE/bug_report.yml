name: Bug report
description: Report something that is broken in My Vault
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Privacy warning — read first
        **Never attach real documents or personal information to a GitHub issue.**
        Do not upload Aadhaar cards, PAN cards, passports, certificates, document numbers, names, photos, dates of birth, or screenshots containing any of them.
        If a sample is needed, create a clearly fake document or fully redact every personal detail first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without including real document contents or personal details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that lead to the problem.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: My Vault version
      placeholder: "For example: 1.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "For example: Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra details
      description: Only add screenshots using fake/sample documents or screenshots with all personal information completely hidden.
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      options:
        - label: I confirm this issue contains no real documents, ID numbers, or personal information.
          required: true
